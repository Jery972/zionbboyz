<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#161415" />
    <title>Page introuvable — Zion Bboyz</title>
    <style>
      :root {
        color-scheme: dark light;
      }
      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        background: #161415;
        color: #fff;
        font-family: system-ui, -apple-system, Segoe UI, Roboto,
          "Helvetica Neue", Arial, "Noto Sans", "Apple Color Emoji",
          "Segoe UI Emoji";
        display: grid;
        place-items: center;
      }
      main {
        text-align: center;
        padding: 2rem;
      }
      h1 {
        font-size: clamp(2rem, 6vw, 4rem);
        margin: 0 0 0.5rem;
        font-weight: 700;
      }
      p {
        font-size: clamp(1rem, 2.5vw, 1.25rem);
        margin: 0 0 1.5rem;
        opacity: 0.9;
      }
      .links {
        display: inline-flex;
        gap: 1rem;
        align-items: center;
        flex-wrap: wrap;
      }
      a {
        color: #fff;
        text-decoration: none;
        border-bottom: 1px solid currentColor;
        padding-bottom: 2px;
      }
      a:hover {
        opacity: 0.9;
      }
      a:focus-visible {
        outline: 2px solid #fff;
        outline-offset: 3px;
        border-bottom-color: transparent;
      }
      @media (prefers-reduced-motion: reduce) {
        html {
          scroll-behavior: auto;
        }
      }
    </style>
  </head>
  <body>
    <main role="main">
      <h1>404 — Page introuvable</h1>
      <p>La page que vous cherchez n’existe plus ou a été déplacée.</p>
      <div class="links">
        <a href="/">Aller à l’accueil (FR)</a>
        <a href="/en/">Go to Home (EN)</a>
      </div>
    </main>
  </body>
</html>
